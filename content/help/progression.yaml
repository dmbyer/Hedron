id: progression
title: Progression
aliases:
  - experience
  - xp
  - improving
seeAlso:
  - combat
  - getting-started
body: |
  You grow stronger by doing. Defeating creatures, using your abilities and enduring
  blows all earn experience, and experience improves the parts of your character you
  actually use.

  'progress' shows how close each part of your character is to its next improvement.
  'skills' shows how your skills are coming along.

  Challenge matters. Fights near your own strength teach you the most; creatures you have
  clearly outgrown teach you little or nothing. To keep improving, keep looking for
  opponents that test you.
